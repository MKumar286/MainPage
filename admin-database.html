<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Student Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold text-indigo-600">Careergraspp</span>
                <span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-semibold">Admin Panel</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportTableToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Export CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Dynamic Dynamic Stats Cards (Requirement 5) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Filtered Revenue</p>
                <h3 id="stat-total-revenue" class="text-2xl font-bold text-gray-900 mt-1">₹0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total Students Shown</p>
                <h3 id="stat-total-students" class="text-2xl font-bold text-gray-900 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total Enrollments</p>
                <h3 id="stat-total-enrollments" class="text-2xl font-bold text-gray-900 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Multi-Course Students</p>
                <h3 id="stat-multi-course" class="text-2xl font-bold text-indigo-600 mt-1">0</h3>
            </div>
        </div>

        <!-- Cascading Filter Bar (Requirement 4) -->
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-wrap gap-4 items-center">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-xs font-medium text-gray-500 mb-1">Search Keyword</label>
                <input type="text" id="filter-search" oninput="handleFilterChange()" placeholder="Name, Email, Phone..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="w-48">
                <label class="block text-xs font-medium text-gray-500 mb-1">Organization</label>
                <select id="filter-org" onchange="handleFilterChange()" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">All Organizations</option>
                </select>
            </div>
            <div class="w-48">
                <label class="block text-xs font-medium text-gray-500 mb-1">Course Purchased</label>
                <select id="filter-course" onchange="handleFilterChange()" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">All Courses</option>
                </select>
            </div>
            <div class="pt-5">
                <button onclick="resetFilters()" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">Reset Filters</button>
            </div>
        </div>

        <!-- Student Database Table -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600" id="students-table">
                    <thead class="bg-gray-50 border-b border-gray-200 text-xs text-gray-700 uppercase">
                        <tr>
                            <th class="px-6 py-3">Student Name</th>
                            <th class="px-6 py-3">Contact Details</th>
                            <th class="px-6 py-3">Organization</th>
                            <!-- Requirement 3: Added Column -->
                            <th class="px-6 py-3 text-center">No of courses Choosed</th>
                            <!-- Requirement 6: Displays Multi-Courses -->
                            <th class="px-6 py-3">Purchased Courses</th>
                            <th class="px-6 py-3">Total Paid</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200">
                        <!-- Loaded dynamically via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Firebase Config (Replace with your SDK Config)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let rawStudentsData = [];
        let courseMap = {};

        // Fetch Initial Data
        async function loadDatabaseData() {
            // Load Courses Lookup Map
            const coursesSnap = await db.collection('courses').get();
            coursesSnap.forEach(doc => {
                courseMap[doc.id] = doc.data().title || doc.id;
            });

            // Load Students Records
            const studentsSnap = await db.collection('students').get();
            rawStudentsData = [];
            
            studentsSnap.forEach(doc => {
                const data = doc.data();
                const coursesList = data.enrolledCourses || [];
                rawStudentsData.push({
                    id: doc.id,
                    name: data.name || 'N/A',
                    email: data.email || 'N/A',
                    phone: data.phone || 'N/A',
                    orgCode: data.orgCode || 'Direct/Self',
                    courses: coursesList,
                    courseCount: coursesList.length, // Requirement 3
                    totalPaid: data.totalAmountPaid || (coursesList.length * 499)
                });
            });

            handleFilterChange();
        }

        // Requirement 4: Dynamically update cascading filters & Requirement 5: Dynamic Stats
        function handleFilterChange() {
            const searchValue = document.getElementById('filter-search').value.toLowerCase();
            const selectedOrg = document.getElementById('filter-org').value;
            const selectedCourse = document.getElementById('filter-course').value;

            // 1. Filter dataset based on current dropdown states
            const filteredData = rawStudentsData.filter(student => {
                const matchesSearch = student.name.toLowerCase().includes(searchValue) ||
                                      student.email.toLowerCase().includes(searchValue) ||
                                      student.phone.toLowerCase().includes(searchValue);
                
                const matchesOrg = !selectedOrg || student.orgCode === selectedOrg;
                const matchesCourse = !selectedCourse || student.courses.includes(selectedCourse);

                return matchesSearch && matchesOrg && matchesCourse;
            });

            // 2. Dynamically refresh dropdown options based on current filter results
            updateDropdownOptions(filteredData, selectedOrg, selectedCourse);

            // 3. Update Statistics Cards (Requirement 5)
            updateStatsCards(filteredData);

            // 4. Render Table (Requirements 3 & 6)
            renderTableRows(filteredData);
        }

        function updateDropdownOptions(currentFilteredData, activeOrg, activeCourse) {
            const orgSelect = document.getElementById('filter-org');
            const courseSelect = document.getElementById('filter-course');

            // Collect unique valid Orgs and Courses in visible records
            const availableOrgs = new Set();
            const availableCourses = new Set();

            rawStudentsData.forEach(s => {
                if (!activeCourse || s.courses.includes(activeCourse)) {
                    availableOrgs.add(s.orgCode);
                }
                if (!activeOrg || s.orgCode === activeOrg) {
                    s.courses.forEach(c => availableCourses.add(c));
                }
            });

            // Re-render Org Options
            orgSelect.innerHTML = `<option value="">All Organizations</option>` +
                Array.from(availableOrgs).map(org => `<option value="${org}" ${org === activeOrg ? 'selected' : ''}>${org}</option>`).join('');

            // Re-render Course Options
            courseSelect.innerHTML = `<option value="">All Courses</option>` +
                Array.from(availableCourses).map(cId => `<option value="${cId}" ${cId === activeCourse ? 'selected' : ''}>${courseMap[cId] || cId}</option>`).join('');
        }

        function updateStatsCards(data) {
            const totalRevenue = data.reduce((sum, s) => sum + Number(s.totalPaid || 0), 0);
            const totalEnrollments = data.reduce((sum, s) => sum + s.courseCount, 0);
            const multiCourseStudents = data.filter(s => s.courseCount > 1).length;

            document.getElementById('stat-total-revenue').innerText = `₹${totalRevenue.toLocaleString('en-IN')}`;
            document.getElementById('stat-total-students').innerText = data.length;
            document.getElementById('stat-total-enrollments').innerText = totalEnrollments;
            document.getElementById('stat-multi-course').innerText = multiCourseStudents;
        }

        function renderTableRows(data) {
            const tbody = document.getElementById('table-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-400">No matching records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(s => {
                // Requirement 6: Render all purchased courses as tags
                const courseBadges = s.courses.map(cId => 
                    `<span class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded border border-indigo-100 font-medium mr-1 mb-1">${courseMap[cId] || cId}</span>`
                ).join('') || '<span class="text-gray-400 italic">None</span>';

                return `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 font-semibold text-gray-900">${s.name}</td>
                        <td class="px-6 py-4">
                            <div class="text-gray-900 font-medium">${s.email}</div>
                            <div class="text-xs text-gray-400">${s.phone}</div>
                        </td>
                        <td class="px-6 py-4"><span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs font-mono">${s.orgCode}</span></td>
                        <!-- Requirement 3: Display total courses count -->
                        <td class="px-6 py-4 text-center font-bold text-gray-900">
                            <span class="inline-flex items-center justify-center w-7 h-7 bg-indigo-100 text-indigo-800 rounded-full text-xs">
                                ${s.courseCount}
                            </span>
                        </td>
                        <!-- Requirement 6: Show all purchased courses -->
                        <td class="px-6 py-4 max-w-xs">${courseBadges}</td>
                        <td class="px-6 py-4 font-bold text-emerald-600">₹${s.totalPaid}</td>
                    </tr>
                `;
            }).join('');
        }

        function resetFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-org').value = '';
            document.getElementById('filter-course').value = '';
            handleFilterChange();
        }

        function exportTableToCSV() {
            let csv = ['Name,Email,Phone,Organization,No of Courses Choosed,Purchased Courses,Total Paid'];
            rawStudentsData.forEach(s => {
                const coursesStr = `"${s.courses.map(c => courseMap[c] || c).join(', ')}"`;
                csv.push(`"${s.name}","${s.email}","${s.phone}","${s.orgCode}",${s.courseCount},${coursesStr},${s.totalPaid}`);
            });
            const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Student_Database.csv');
            a.click();
        }

        // Initialize dashboard
        window.addEventListener('DOMContentLoaded', loadDatabaseData);
    </script>
</body>
</html>
